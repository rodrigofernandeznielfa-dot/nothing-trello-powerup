name: NOTHING · Publicar Power-Up

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.svg'
      - '.github/workflows/rebuild-pages.yml'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nothing-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare ONLY static Power-Up files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          find . -maxdepth 1 -type f \
            \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.svg' \) \
            -exec cp -t _site {} +
          touch _site/.nojekyll
          for file in index.html connector.html connector-v13.html connector-v17.html progress-panel.html progress-panel.js reference-catalog.js dependencies.js; do
            test -s "_site/$file" || { echo "::error::Missing $file in Pages artifact"; exit 1; }
          done
          printf 'Prepared %s static files for commit %s\n' "$(find _site -type f | wc -l)" "$GITHUB_SHA"
          ls -la _site

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in _site/*.js; do
            node --input-type=module --check < "$file"
          done

      - name: Test connector startup and failed Trello requests
        run: node --test tests/*.test.cjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact deployed revision for verification
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed files are publicly accessible
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}"
          for file in connector.html connector-v13.html connector-v17.html progress-panel.html progress-panel.js dependencies.js reference-catalog.js; do
            echo "Checking ${base}/${file}"
            target="$RUNNER_TEMP/nb-deployed-$file"
            verified=false
            for attempt in {1..8}; do
              if curl --fail --silent --show-error --location --max-time 20 \
                --output "$target" "${base}/${file}?nb_revision=${GITHUB_SHA}" && cmp -s "$file" "$target"; then
                verified=true
                break
              fi
              echo "Waiting for the current revision of $file (attempt $attempt)"
              sleep 8
            done
            if [ "$verified" != true ]; then
              echo "::error::Published $file does not match commit $GITHUB_SHA"
              exit 1
            fi
          done
          echo "All required Power-Up files match commit $GITHUB_SHA."
