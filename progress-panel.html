<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOTHING · Estado del trabajo</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;padding:12px 14px;background:#fff;color:#172b4d;font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header,.between{display:flex;align-items:center;justify-content:space-between;gap:9px}
header{margin-bottom:10px}h2{font-size:14px;margin:0;font-weight:700}
.small,.muted{color:#626f86;font-size:11px}
.tag{background:#f1f2f4;color:#44546f;border-radius:5px;padding:4px 8px;font-size:11px;font-weight:650}
.tag.blocked{background:#fff0ee;color:#9a3535;border:1px solid #f4d3d0}
.blocker{background:#f8f9fb;border-left:3px solid #d99c97;border-radius:5px;padding:7px 10px;margin-bottom:10px;color:#44546f}
.blocker strong{font-size:11px;font-weight:650}.blocker p{margin:3px 0 0;font-size:12px;line-height:1.45}
.blocker a{color:#44546f;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.blocker a:focus-visible{outline:2px solid #6a788e;outline-offset:2px}
.summary{border:1px solid #dfe3e8;border-radius:9px;padding:12px;background:#fafbfc}
.value{font-size:19px;font-weight:750;font-variant-numeric:tabular-nums}
.track{display:flex;gap:3px;margin:9px 0 6px}.segment{flex:1;height:8px;background:#e4e8ed;border-radius:3px}.segment.done{background:#4b9b7a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid #e4e8ed}
.time{font-weight:700;font-size:16px;color:#172b4d}
.next{margin-top:10px;padding:10px 12px;background:#f1f7f4;border-radius:8px;border-left:3px solid #4b9b7a}
.next strong{font-size:11px;color:#44546f}.next p{margin:3px 0 0;overflow-wrap:anywhere}
#status{color:#626f86;font-size:12px;padding:8px 0}
#warning:not(:empty){margin-top:8px;color:#805900;font-size:11px}
.notice{margin:3px 0}
footer{margin-top:8px;font-size:10px;color:#626f86}
[hidden]{display:none!important}
</style>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./dependencies.js?v=1"></script>
<script defer src="./progress-panel.js?v=5"></script>
</head><body>
<header><h2>Estado del trabajo</h2><span class="tag" id="state">Cargando</span></header>
<div id="status">Consultando datos…</div>
<div id="blocker" class="blocker" hidden></div>
<main id="content" hidden>
<div class="summary">
 <div class="between"><span><strong>Progreso</strong> <span class="small" id="done"></span></span><span class="value" id="percent">—</span></div>
 <div class="track" id="track" aria-hidden="true"></div><span id="left" class="small"></span>
 <div class="grid">
  <div><div class="muted">Invertido</div><div class="time" id="spent">—</div><div id="spentCaption" class="small" hidden></div></div>
  <div><div class="muted">Por hacer</div><div class="time" id="remaining">—</div><div id="remainCaption" class="small" hidden></div></div>
 </div>
</div>
<div class="next"><strong>Siguiente paso</strong><p id="next">—</p></div>
<div id="warning" hidden></div>
<ul id="steps" hidden></ul>
</main>
<footer>≈ indica una duración aproximada, no cronometrada.</footer>
</body></html>
